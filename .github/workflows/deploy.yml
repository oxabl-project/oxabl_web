name: Deploy

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, and deploy from master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm seo:check
      # Static assets only (wrangler.jsonc): Cloudflare serves dist/ as oxabl.org.
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action's default, wrangler 3, cannot deploy static assets without a script.
          wranglerVersion: "4.160.1"
          command: deploy
      - name: Check what oxabl.org serves
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/check-seo.mjs --live
